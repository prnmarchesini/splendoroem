server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    charset_types text/plain text/xml application/xml text/css application/javascript;

    # Uma URL só para o Google: www → domínio sem www.
    if ($host = www.splendoroem.com.br) {
        return 301 https://splendoroem.com.br$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/      { add_header Cache-Control "public, max-age=604800"; }
    location / { try_files $uri $uri/ =404; }
}
